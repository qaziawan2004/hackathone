<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <link rel="stylesheet" href="output.css" />
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white shadow-2xl rounded-2xl p-8 border border-gray-200">
        <h1 id="h1" class="text-3xl font-bold text-center mb-6 text-gray-800">User Login</h1>

        <form class="space-y-4" onsubmit="return false;">
            <div>
                <label for="name" class="block font-medium text-gray-700">Name:</label>
                <input type="text" id="name" placeholder="Enter your name here!" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none" />
            </div>

            <div>
                <label for="father-name" class="block font-medium text-gray-700">Father Name:</label>
                <input type="text" id="father-name" placeholder="Enter your father name here!" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none" />
            </div>

            <div>
                <label for="email" class="block font-medium text-gray-700">Email:</label>
                <input type="email" id="email" placeholder="Enter your email here!" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none" />
            </div>

            <div>
                <label for="password" class="block font-medium text-gray-700">Password:</label>
                <input type="password" id="password" placeholder="Enter your password here!" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none" />
            </div>

            <div class="gender-row flex items-center gap-4 mt-2">
                <span class="font-medium text-gray-700">Gender:</span>
                <label class="flex items-center gap-1"><input type="radio" name="gender" value="male" /> Male</label>
                <label class="flex items-center gap-1"><input type="radio" name="gender" value="female" /> Female</label>
            </div>

            <div>
                <label for="address" class="block font-medium text-gray-700">Address:</label>
                <input type="text" id="address" placeholder="Enter your address here..!" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none" />
            </div>

            <label class="checkbox-row flex items-center gap-2 mt-2 text-gray-700">
                <input type="checkbox" id="privacy-policy" />
                Do you agree with terms and conditions...
            </label>

            <div class="controls flex justify-between mt-4">
                <button type="button"  onclick="signUp()" class="w-1/2 mr-2 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">Sign Up</button>
                <button type="button" onclick="signIn()" class="w-1/2 ml-2 bg-gray-700 text-white py-2 rounded-lg hover:bg-gray-800 transition">Sign In</button>
            </div>

            <div id="message" class="text-center text-red-600 font-medium mt-2"></div>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
